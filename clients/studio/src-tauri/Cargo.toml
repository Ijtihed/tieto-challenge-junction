[package]
name = "schema-studio"
version = "1.0.0"
description = "Schema Studio — the trust layer for vibe coding"
authors = ["Schema AI"]
license = "MIT"
repository = "https://github.com/Ijtihed/schemav3"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
open = "5"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
